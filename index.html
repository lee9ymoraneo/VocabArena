<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Vocab Arena</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}.container{text-align:center;padding:2rem;max-width:700px;width:90%}h1{font-size:3rem;font-weight:800;background:linear-gradient(90deg,#e94560,#f5a623);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.5rem}h1 span{font-size:1.2rem;display:block;-webkit-text-fill-color:#a8b2d8;font-weight:400;margin-top:.3rem}.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:2.5rem;margin:2rem 0;backdrop-filter:blur(10px)}.word{font-size:2.5rem;font-weight:700;color:#e2e8f0;margin-bottom:1rem}.hint{color:#a8b2d8;font-size:1rem;margin-bottom:1.5rem}.options{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.5rem}button.opt{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#e2e8f0;padding:1rem;border-radius:12px;font-size:1rem;cursor:pointer;transition:all .2s}button.opt:hover{background:rgba(233,69,96,.3);border-color:#e94560;transform:translateY(-2px)}button.opt.correct{background:rgba(72,187,120,.3);border-color:#48bb78}button.opt.wrong{background:rgba(233,69,96,.3);border-color:#e94560}.score{font-size:1.2rem;color:#a8b2d8;margin-bottom:1rem}.score span{color:#f5a623;font-weight:700;font-size:1.5rem}#feedback{font-size:1.1rem;min-height:1.5rem;margin-top:1rem;font-weight:600}#next-btn{background:linear-gradient(90deg,#e94560,#f5a623);border:none;color:#fff;padding:.8rem 2.5rem;border-radius:50px;font-size:1rem;cursor:pointer;margin-top:1rem;display:none;font-weight:600;transition:transform .2s}#next-btn:hover{transform:scale(1.05)}.progress{width:100%;background:rgba(255,255,255,.1);border-radius:10px;height:8px;margin-bottom:1rem}.progress-bar{height:100%;border-radius:10px;background:linear-gradient(90deg,#e94560,#f5a623);transition:width .3s}</style></head><body><div class="container"><h1>Vocab Arena<span>Test Your Vocabulary</span></h1><div class="score">Score: <span id="score">0</span> &nbsp;|&nbsp; Q: <span id="qnum">1</span>/10</div><div class="progress"><div class="progress-bar" id="prog" style="width:10%"></div></div><div class="card"><div class="word" id="word"></div><div class="hint" id="hint"></div><div class="options" id="opts"></div><div id="feedback"></div><button id="next-btn" onclick="nextQ()">Next &rarr;</button></div></div><script>const data=[{w:'Ephemeral',h:'adjective',d:'Lasting for a very short time',opts:['Lasting forever','Lasting a short time','Very bright','Deeply hidden']},{w:'Eloquent',h:'adjective',d:'Fluent or persuasive in speaking',opts:['Clumsy with words','Fluent and persuasive','Very quiet','Extremely loud']},{w:'Benevolent',h:'adjective',d:'Well meaning and kindly',opts:['Cruel and harsh','Well meaning and kind','Indifferent','Secretive']},{w:'Cogent',h:'adjective',d:'Clear and convincing',opts:['Confusing','Clear and convincing','Irrelevant','Boring']},{w:'Loquacious',h:'adjective',d:'Tending to talk a great deal',opts:['Very quiet','Talkative','Mysterious','Lazy']},{w:'Prudent',h:'adjective',d:'Acting with care and thought',opts:['Reckless','Careful and wise','Generous','Fearful']},{w:'Ambiguous',h:'adjective',d:'Open to more than one interpretation',opts:['Clear and obvious','Open to interpretation','Absolute','Simple']},{w:'Tenacious',h:'adjective',d:'Holding firm to purpose',opts:['Giving up easily','Holding firm','Flexible','Indecisive']},{w:'Verbose',h:'adjective',d:'Using more words than needed',opts:['Brief and concise','Using too many words','Silent','Unclear']},{w:'Astute',h:'adjective',d:'Having an ability to accurately assess situations',opts:['Foolish','Shrewd and clever','Generous','Emotional']}];let idx=0,score=0,answered=false;function load(){const q=data[idx];document.getElementById('word').textContent=q.w;document.getElementById('hint').textContent='('+q.h+')';document.getElementById('feedback').textContent='';document.getElementById('next-btn').style.display='none';document.getElementById('prog').style.width=((idx+1)/data.length*100)+'%';document.getElementById('qnum').textContent=idx+1;const opts=document.getElementById('opts');opts.innerHTML='';const shuffled=[...q.opts].sort(()=>Math.random()-.5);shuffled.forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>check(o,q.d,b);opts.appendChild(b)});answered=false}function check(chosen,correct,btn){if(answered)return;answered=true;const btns=document.querySelectorAll('.opt');btns.forEach(b=>{b.disabled=true;if(b.textContent===correct)b.classList.add('correct')});if(chosen===correct){score++;document.getElementById('score').textContent=score;document.getElementById('feedback').style.color='#48bb78';document.getElementById('feedback').textContent='Correct!'}else{btn.classList.add('wrong');document.getElementById('feedback').style.color='#e94560';document.getElementById('feedback').textContent='Wrong! Answer: '+correct}document.getElementById('next-btn').style.display='inline-block'}function nextQ(){idx++;if(idx>=data.length){document.querySelector('.card').innerHTML='<div style="font-size:2rem;font-weight:700;margin-bottom:1rem">Game Over!</div><div style="font-size:1.2rem;color:#a8b2d8">Final Score: <span style="color:#f5a623;font-size:2rem;font-weight:700">'+score+'/'+data.length+'</span></div><button onclick="location.reload()" style="margin-top:2rem;background:linear-gradient(90deg,#e94560,#f5a623);border:none;color:#fff;padding:.8rem 2.5rem;border-radius:50px;font-size:1rem;cursor:pointer;font-weight:600">Play Again</button>'}else{load()}}load();</script></body></html>
